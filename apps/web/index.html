<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#0a0a0a";
        const CUSTOM_THEMES_STORAGE_KEY = "t3code:themes:v1";
        const THEME_FOLLOW_SYSTEM_STORAGE_KEY = "t3code:theme-follow-system";
        const THEME_APPEARANCE_MODE_STORAGE_KEY = "t3code:theme-appearance-mode";
        const THEME_HALVES_STORAGE_KEY = "t3code:theme-halves:v1";
        const SPLASH_COLORS = {
          light: {
            background: "#ffffff",
            foreground: "#262626",
            accent: "#4f46e5",
          },
          dark: {
            background: "#0a0a0a",
            foreground: "#f5f5f5",
            accent: "#818cf8",
          },
        };
        // These are the runtime defaults used to complete a custom palette
        // when a stored theme omits a role. Keep them separate from the
        // unselected splash so a partial custom theme does not flash generic
        // app colors before React mounts.
        const DEFAULT_THEME_PALETTES = {
          light: {
            background: "#fdf7fd",
            foreground: "#501854",
            accent: "#db2777",
            chrome: "#fdf7fd",
          },
          dark: {
            background: "#1f1a24",
            foreground: "#f9f8fb",
            accent: "#a3004c",
            chrome: "#1f1a24",
          },
        };
        // Keep this small boot-time copy in sync with the built-in palettes so
        // the selected theme is visible before the app has mounted.
        const BUILT_IN_THEME_PALETTES = {
          paper: {
            light: {
              background: "oklch(0.982097 0.002477 84.558)",
              foreground: "oklch(0.222003 0.03479 328.979)",
              accent: "oklch(0.471015 0.010291 73.637)",
              chrome: "oklch(0.982097 0.002477 84.558)",
            },
            dark: {
              background: "oklch(0.218914 0.006526 78.185)",
              foreground: "oklch(0.990339 0.008411 325.64)",
              accent: "oklch(0.781805 0.007264 56.305)",
              chrome: "oklch(0.218914 0.006526 78.185)",
            },
          },
          graphite: {
            light: {
              background: "oklch(0.967434 0.001326 286.375)",
              foreground: "oklch(0.222003 0.03479 328.979)",
              accent: "oklch(0.45322 0.015072 285.783)",
              chrome: "oklch(0.967434 0.001326 286.375)",
            },
            dark: {
              background: "oklch(0.188083 0.006031 285.806)",
              foreground: "oklch(0.990339 0.008411 325.64)",
              accent: "oklch(0.709794 0.013034 286.063)",
              chrome: "oklch(0.188083 0.006031 285.806)",
            },
          },
          tsukimi: {
            light: {
              background: "oklch(0.959894 0.006946 98.177)",
              foreground: "oklch(0.222003 0.03479 328.979)",
              accent: "oklch(0.512233 0.034286 174.771)",
              chrome: "oklch(0.959894 0.006946 98.177)",
            },
            dark: {
              background: "oklch(0.215163 0.009777 173.192)",
              foreground: "oklch(0.990339 0.008411 325.64)",
              accent: "oklch(0.705446 0.043964 170.951)",
              chrome: "oklch(0.215163 0.009777 173.192)",
            },
          },
          aizome: {
            light: {
              background: "oklch(0.956075 0.004879 239.806)",
              foreground: "oklch(0.222003 0.03479 328.979)",
              accent: "oklch(0.460781 0.090032 257.013)",
              chrome: "oklch(0.956075 0.004879 239.806)",
            },
            dark: {
              background: "oklch(0.200147 0.018708 255.739)",
              foreground: "oklch(0.990339 0.008411 325.64)",
              accent: "oklch(0.655989 0.090428 265.787)",
              chrome: "oklch(0.200147 0.018708 255.739)",
            },
          },
          urushi: {
            light: {
              background: "oklch(0.954036 0.005165 51.41)",
              foreground: "oklch(0.222003 0.03479 328.979)",
              accent: "oklch(0.488723 0.14076 15.778)",
              chrome: "oklch(0.954036 0.005165 51.41)",
            },
            dark: {
              background: "oklch(0.180375 0.021581 354.729)",
              foreground: "oklch(0.990339 0.008411 325.64)",
              accent: "oklch(0.620247 0.148157 18.313)",
              chrome: "oklch(0.180375 0.021581 354.729)",
            },
          },
          obsidian: {
            light: {
              background: "oklch(0.971767 0.004466 197.083)",
              foreground: "oklch(0.222003 0.03479 328.979)",
              accent: "oklch(0.520974 0.087836 186.373)",
              chrome: "oklch(0.971767 0.004466 197.083)",
            },
            dark: {
              background: "oklch(0.174879 0.012255 264.187)",
              foreground: "oklch(0.990339 0.008411 325.64)",
              accent: "oklch(0.785391 0.132273 181.968)",
              chrome: "oklch(0.174879 0.012255 264.187)",
            },
          },
          carbon: {
            light: {
              background: "oklch(0.970497 0.003806 78.301)",
              foreground: "oklch(0.222003 0.03479 328.979)",
              accent: "oklch(0.544631 0.135245 50.822)",
              chrome: "oklch(0.970497 0.003806 78.301)",
            },
            dark: {
              background: "oklch(0.178529 0.004066 285.981)",
              foreground: "oklch(0.990339 0.008411 325.64)",
              accent: "oklch(0.746877 0.155118 72.187)",
              chrome: "oklch(0.178529 0.004066 285.981)",
            },
          },
          "oled-void": {
            light: {
              background: "oklch(0.985104 0 0)",
              foreground: "oklch(0.222003 0.03479 328.979)",
              accent: "oklch(0.453064 0.015251 285.775)",
              chrome: "oklch(0.985104 0 0)",
            },
            dark: {
              background: "#000000",
              foreground: "oklch(0.990339 0.008411 325.64)",
              accent: "oklch(0.919729 0.004031 286.32)",
              chrome: "#000000",
            },
          },
        };
        // Keep the built-in mode list in sync with the runtime so the selected
        // palette is visible before React has mounted.
        const BUILT_IN_THEME_MODES = Object.fromEntries(
          Object.entries(BUILT_IN_THEME_PALETTES).map(([id, palettes]) => [
            id,
            Object.keys(palettes),
          ]),
        );
        // Paper and Tsukimi are light-first; the rest of the curated set is
        // dark-first, so the base appearance cannot be assumed. Mirrors each
        // ThemeDefinition's `appearance`.
        const BUILT_IN_THEME_APPEARANCES = {
          paper: "light",
          graphite: "dark",
          tsukimi: "light",
          aizome: "dark",
          urushi: "dark",
          obsidian: "dark",
          carbon: "dark",
          "oled-void": "dark",
        };
        // Retired palettes keep their ids claimed here, exactly as the runtime
        // does, so a custom theme can never collide with a name an older
        // settings.json may still be pinned to.
        const RESERVED_THEME_IDS = [
          "system",
          "light",
          "dark",
          "paper",
          "graphite",
          "tsukimi",
          "aizome",
          "urushi",
          "t3-chat",
          "grove",
          "ocean",
          "ember",
          "iris",
          "obsidian",
          "midnight",
          "carbon",
          "nebula",
          "oled-void",
          "oled-azure",
          "oled-phosphor",
          "oled-plasma",
          "t3-chat-dark",
          "t3-grove",
          "t3-ocean",
          "t3-ember",
          "t3-iris",
          "t3-obsidian",
          "t3-midnight",
          "t3-carbon",
          "t3-nebula",
          "t3-oled-void",
          "t3-oled-azure",
          "t3-oled-phosphor",
          "t3-oled-plasma",
        ];
        // Update every theme-color meta so any element another layer added
        // carries the resolved color too.
        const setThemeColor = (color) => {
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.setAttribute("content", color);
          }
        };

        // Read before anything paints. When the OS draws a material behind the
        // window, the chrome fill below must never land -- even one frame of it
        // reads as a flash of solid color over the user's desktop.
        let windowVibrancy = null;
        try {
          windowVibrancy = window.desktopBridge?.getWindowVibrancy?.() ?? null;
        } catch {
          // A preload too old to answer means no material to preserve.
        }
        if (windowVibrancy) {
          document.documentElement.dataset.windowVibrancy = windowVibrancy;
        }
        const setChromeBackgroundColor = (color) => {
          document.documentElement.style.backgroundColor = windowVibrancy ? "transparent" : color;
        };

        // The runtime decodes the same literal CSS formats into OKLCH. Keep
        // contextual colors out: they cannot be resolved from stored data.
        const SYSTEM_COLOR_KEYWORD =
          /^(?:accentcolor(?:text)?|active(?:border|caption|text)|appworkspace|background|button(?:border|face|highlight|shadow|text)|canvas(?:text)?|captiontext|field(?:text)?|graytext|highlight(?:text)?|inactive(?:border|caption(?:text)?)|info(?:background|text)|linktext|mark(?:text)?|menu(?:text)?|scrollbar|selecteditem(?:text)?|threed(?:darkshadow|face|highlight|lightshadow|shadow)|visitedtext|window(?:frame|text)?)$/i;
        const isThemeColor = (value) => {
          if (typeof value !== "string" || typeof CSS === "undefined") return false;
          const color = value.trim();
          if (
            /^(?:currentcolor|inherit|initial|revert|revert-layer|unset)$/i.test(color) ||
            SYSTEM_COLOR_KEYWORD.test(color) ||
            /\bfrom\b|(?:var|env|attr|calc|min|max|clamp)\(/i.test(color)
          ) {
            return false;
          }
          const isLiteralColor =
            /^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(color) ||
            /^[a-z]+$/i.test(color) ||
            /^(?:rgba?|hsla?|hwb|lab|lch|oklab|oklch|color)\(/i.test(color);
          return isLiteralColor && CSS.supports("color", color);
        };
        const isRecord = (value) =>
          typeof value === "object" && value !== null && !Array.isArray(value);
        const isThemeId = (value) =>
          typeof value === "string" && /^[a-z0-9](?:[a-z0-9-]{0,47})$/.test(value);
        const isThemeLabel = (value) =>
          typeof value === "string" && value.trim().length > 0 && value.trim().length <= 48;
        const isThemePreferenceMode = (value) =>
          value === "light" || value === "dark" || value === "system";
        const isThemeAppearance = (value) => value === "light" || value === "dark";
        const isStoredCustomTheme = (value) => {
          if (
            !isRecord(value) ||
            !isThemeId(value.id) ||
            RESERVED_THEME_IDS.includes(value.id) ||
            !isThemeLabel(value.label) ||
            !isThemeAppearance(value.appearance) ||
            !isRecord(value.colors)
          ) {
            return false;
          }
          if (value.variants === undefined) return true;
          if (!isRecord(value.variants)) return false;
          return Object.entries(value.variants).every(
            ([appearance, colors]) =>
              isThemeAppearance(appearance) &&
              (appearance === value.appearance || isRecord(colors)),
          );
        };
        const findCustomTheme = (themeId) => {
          if (RESERVED_THEME_IDS.includes(themeId)) return null;
          try {
            const parsed = JSON.parse(
              window.localStorage.getItem(CUSTOM_THEMES_STORAGE_KEY) ?? "null",
            );
            if (!Array.isArray(parsed)) return null;
            return (
              parsed.find((value) => isStoredCustomTheme(value) && value.id === themeId) ?? null
            );
          } catch {
            return null;
          }
        };

        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          // Older builds stored the dark Sakura palette as its own theme id
          // and every maintainer theme under a t3- prefix; keep those
          // preferences readable. Mirrors the runtime's legacy alias table.
          const LEGACY_THEME_IDS = {
            "t3-chat-dark": "t3-chat",
            "t3-grove": "grove",
            "t3-ocean": "ocean",
            "t3-ember": "ember",
            "t3-iris": "iris",
          };
          const isLegacyT3ChatDark = storedTheme === "t3-chat-dark";
          const themeId =
            storedTheme === null ? "" : (LEGACY_THEME_IDS[storedTheme] ?? storedTheme);
          const legacyMode = isLegacyT3ChatDark ? "dark" : null;
          const builtInModes = BUILT_IN_THEME_MODES[themeId] ?? null;
          const customTheme = builtInModes ? null : findCustomTheme(themeId);
          const themeModes =
            builtInModes ??
            (customTheme
              ? ["light", "dark"].filter(
                  (mode) => mode === customTheme.appearance || customTheme.variants?.[mode],
                )
              : null);
          // Mirrors the runtime's isKnownThemePreference.
          const isKnownTheme =
            storedTheme === "light" ||
            storedTheme === "dark" ||
            storedTheme === "system" ||
            themeModes !== null;
          const theme = isKnownTheme && storedTheme ? storedTheme : "system";
          const isThemed = isKnownTheme && themeModes !== null;
          const baseAppearance = customTheme
            ? customTheme.appearance
            : (BUILT_IN_THEME_APPEARANCES[themeId] ?? "light");
          const systemMode = prefersDark ? "dark" : "light";
          const storedAppearanceMode = window.localStorage.getItem(
            THEME_APPEARANCE_MODE_STORAGE_KEY,
          );
          const storedFollowSystem = window.localStorage.getItem(THEME_FOLLOW_SYSTEM_STORAGE_KEY);
          // Mirrors the runtime's getThemePreferenceMode fallback: a bare
          // "light"/"dark" preference names its own mode.
          const preferenceMode =
            theme === "light" || theme === "dark" ? theme : (legacyMode ?? baseAppearance);
          const appearanceMode = isThemePreferenceMode(storedAppearanceMode)
            ? storedAppearanceMode
            : storedFollowSystem === "true"
              ? "system"
              : storedFollowSystem === "false"
                ? preferenceMode
                : theme === "system"
                  ? "system"
                  : preferenceMode;
          // A valid mix half for the wanted appearance takes over: it decides
          // light vs dark even when the base theme cannot render that mode.
          // Mirrors the runtime's halves-aware resolveThemeAppearance.
          const wantedMode = appearanceMode === "system" ? systemMode : appearanceMode;
          let halfThemeId = null;
          let halfCustomTheme = null;
          try {
            const halvesRaw = JSON.parse(
              window.localStorage.getItem(THEME_HALVES_STORAGE_KEY) ?? "null",
            );
            const candidate = isRecord(halvesRaw) ? halvesRaw[wantedMode] : null;
            if (typeof candidate === "string") {
              const halfId = LEGACY_THEME_IDS[candidate] ?? candidate;
              const halfBuiltIn = BUILT_IN_THEME_MODES[halfId] ?? null;
              const halfCustom = halfBuiltIn ? null : findCustomTheme(halfId);
              const halfModes =
                halfBuiltIn ??
                (halfCustom
                  ? ["light", "dark"].filter(
                      (mode) => mode === halfCustom.appearance || halfCustom.variants?.[mode],
                    )
                  : null);
              if (halfModes && halfModes.includes(wantedMode)) {
                halfThemeId = halfId;
                halfCustomTheme = halfCustom;
              }
            }
          } catch {
            // A malformed mix degrades to the base preference.
          }
          const themeMode = !isThemed
            ? null
            : appearanceMode === "system"
              ? themeModes.includes(systemMode)
                ? systemMode
                : baseAppearance
              : themeModes.includes(appearanceMode)
                ? appearanceMode
                : baseAppearance;
          const isDark =
            halfThemeId !== null
              ? wantedMode === "dark"
              : isThemed
                ? themeMode === "dark"
                : appearanceMode === "system"
                  ? prefersDark
                  : appearanceMode === "dark";
          const effectiveIsThemed = halfThemeId !== null || isThemed;
          const effectiveThemeId = halfThemeId ?? themeId;
          const effectiveCustomTheme = halfThemeId !== null ? halfCustomTheme : customTheme;
          const effectiveThemeMode = halfThemeId !== null ? wantedMode : themeMode;
          const customColors =
            effectiveIsThemed && effectiveCustomTheme
              ? effectiveThemeMode === effectiveCustomTheme.appearance
                ? effectiveCustomTheme.colors
                : (effectiveCustomTheme.variants?.[effectiveThemeMode] ??
                  effectiveCustomTheme.colors)
              : null;
          const customDefaults =
            effectiveCustomTheme && effectiveThemeMode
              ? DEFAULT_THEME_PALETTES[effectiveThemeMode]
              : null;
          // The runtime tolerates individual malformed colors, so fall back
          // per role rather than dropping the theme.
          const builtInSplash =
            effectiveIsThemed && !effectiveCustomTheme && effectiveThemeMode
              ? (BUILT_IN_THEME_PALETTES[effectiveThemeId]?.[effectiveThemeMode] ?? null)
              : null;
          const fallbackSplash = isDark ? SPLASH_COLORS.dark : SPLASH_COLORS.light;
          const customSplash = customColors
            ? {
                background: isThemeColor(customColors.canvas)
                  ? customColors.canvas
                  : (customDefaults?.background ?? fallbackSplash.background),
                foreground: isThemeColor(customColors.text)
                  ? customColors.text
                  : (customDefaults?.foreground ?? fallbackSplash.foreground),
                accent: isThemeColor(customColors.accent)
                  ? customColors.accent
                  : (customDefaults?.accent ?? fallbackSplash.accent),
              }
            : null;
          if (effectiveIsThemed) {
            document.documentElement.dataset.themeId = effectiveCustomTheme
              ? effectiveCustomTheme.id
              : effectiveThemeId;
          } else {
            delete document.documentElement.dataset.themeId;
          }
          // A resolved half is a selection even when the base theme is gone
          // (deleting the base leaves the mix pointing at a real theme).
          const hasSelection = halfThemeId !== null || (isKnownTheme && storedTheme !== null);
          if (hasSelection) {
            document.documentElement.dataset.themeSelected = "true";
          } else {
            delete document.documentElement.dataset.themeSelected;
          }
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = customColors
            ? isThemeColor(customColors.chrome)
              ? customColors.chrome
              : (customDefaults?.chrome ?? fallbackSplash.background)
            : builtInSplash
              ? builtInSplash.chrome
              : isDark
                ? DARK_BACKGROUND
                : LIGHT_BACKGROUND;
          setChromeBackgroundColor(chromeColor);
          if (hasSelection) {
            const splashColors = customSplash ?? builtInSplash ?? fallbackSplash;
            for (const [name, value] of Object.entries(splashColors)) {
              document.documentElement.style.setProperty(`--boot-${name}`, value);
            }
          }
          setThemeColor(chromeColor);
        } catch {
          // Mirror the runtime's storage-failure fallback: follow the OS.
          let prefersDark = true;
          try {
            prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {
            // Keep the dark default when even matchMedia is unavailable.
          }
          delete document.documentElement.dataset.themeId;
          delete document.documentElement.dataset.themeSelected;
          document.documentElement.classList.toggle("dark", prefersDark);
          const fallbackColor = prefersDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          setChromeBackgroundColor(fallbackColor);
          setThemeColor(fallbackColor);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      /* Mirrors --font-sans in src/styles/tokens.css and
         DEFAULT_SANS_FONT_STACK in src/appearanceFonts.ts. The bundled face is
         listed first so the splash and the mounted app set in the same family;
         it is declared in the entry stylesheet, so on a cold start the system
         fallback covers the boot screen and no text reflows. */
      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "Geist Variable",
          "Geist",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #0a0a0a;
        color: #f5f5f5;
      }

      #boot-shell {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
      }

      html[data-theme-selected="true"] #boot-shell {
        background: var(--boot-background);
        color: var(--boot-foreground);
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      /* The mark, not the app-icon tile: inlined so the boot screen paints with
         no extra request, and drawn in currentColor so it follows the resolved
         theme instead of flashing a fixed-colour badge over a themed canvas. */
      #boot-shell-logo {
        width: 64px;
        height: 64px;
      }

      #boot-shell-logo .kasa {
        fill: currentColor;
      }

      #boot-shell-logo .blade {
        fill: #c6303a;
      }

      #boot-error {
        display: grid;
        justify-items: center;
        gap: 16px;
        max-width: 600px;
        padding: 24px;
        text-align: center;
      }

      #boot-error p {
        margin: 0;
        overflow-wrap: anywhere;
      }

      #boot-error button {
        padding: 8px 16px;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
    <title>Ronin (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Ronin splash screen">
          <svg
            id="boot-shell-logo"
            viewBox="6 6 116 116"
            role="img"
            aria-label="Ronin"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path class="blade" d="M120 10C94 54 59 90 16 118C46 78 81 42 120 10Z" />
            <path
              class="kasa"
              d="M64 22C84 40 102 60 118 82C98 101 30 101 10 82C26 60 44 40 64 22Z"
            />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
