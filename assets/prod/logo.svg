<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Production Ronin logo with the corners already rounded, for READMEs, release
    notes, and anywhere a single self-contained file is easier than the raster
    exports. The artwork is assets/brand/ronin-icon.svg; regenerate both from
    there rather than editing this copy.
  -->
  <defs>
    <clipPath id="logo-corners">
      <path
        d="M0 40C0 17.909 17.909 0 40 0H88C110.091 0 128 17.909 128 40V88C128 110.091 110.091 128 88 128H40C17.909 128 0 110.091 0 88V40Z"
      />
    </clipPath>
    <linearGradient id="logo-ink" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1E27" />
      <stop offset="0.55" stop-color="#0E0E13" />
      <stop offset="1" stop-color="#050508" />
    </linearGradient>
    <radialGradient
      id="logo-ember"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(98 22) rotate(133) scale(88 80)"
    >
      <stop stop-color="#C6303A" stop-opacity="0.4" />
      <stop offset="0.55" stop-color="#8E1C26" stop-opacity="0.14" />
      <stop offset="1" stop-color="#06060A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="logo-kasa" x1="26" y1="26" x2="102" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8" />
      <stop offset="1" stop-color="#D8CEBB" />
    </linearGradient>
    <linearGradient id="logo-blade" x1="120" y1="10" x2="16" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2646F" />
      <stop offset="0.5" stop-color="#C6303A" />
      <stop offset="1" stop-color="#7C151C" />
    </linearGradient>
  </defs>

  <g clip-path="url(#logo-corners)">
    <rect width="128" height="128" fill="#0B0B10" />
    <rect width="128" height="128" fill="url(#logo-ink)" />
    <rect width="128" height="128" fill="url(#logo-ember)" />
    <g transform="translate(64 64) scale(0.76) translate(-64 -64)">
      <path d="M120 10C94 54 59 90 16 118C46 78 81 42 120 10Z" fill="url(#logo-blade)" />
      <path
        d="M64 22C84 40 102 60 118 82C98 101 30 101 10 82C26 60 44 40 64 22Z"
        fill="url(#logo-kasa)"
      />
    </g>
  </g>
</svg>
