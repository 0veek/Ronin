        stroke-width="7"
        stroke-linejoin="round"
      />
    </mask>
  </defs>
  <g transform="translate(64 64) scale(0.84) translate(-64 -64)">
    <path
      d="M120 10C94 54 59 90 16 118C46 78 81 42 120 10Z"
      fill="white"
