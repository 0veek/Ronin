<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Single-colour Ronin mark, for Icon Composer's glass layers and anywhere the
    mark inherits one colour (menu bar, tray, monochrome print).

    With hat and blade in the same colour they would merge into one blob, so the
    blade is clipped against an inflated copy of the hat: the mask strokes the
    hat path at width 7, carving a ~3.5 unit halo out of the blade and leaving a
    visible gap where the two shapes meet. Keep the geometry in sync with
    ronin-mark.svg.
  -->
  <defs>
    <mask id="ronin-hat-halo" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="white" />
      <path
        d="M64 22C84 40 102 60 118 82C98 101 30 101 10 82C26 60 44 40 64 22Z"
        fill="black"
        stroke="black"
        stroke-width="7"
        stroke-linejoin="round"
      />
    </mask>
  </defs>

  <path
    d="M120 10C94 54 59 90 16 118C46 78 81 42 120 10Z"
    fill="currentColor"
    mask="url(#ronin-hat-halo)"
  />
  <path
    d="M64 22C84 40 102 60 118 82C98 101 30 101 10 82C26 60 44 40 64 22Z"
    fill="currentColor"
  />
</svg>
